<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three-Tier Remodel Quote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first job ticket — stacked cards, swipeable tier cards, sticky bottom total bar */
:root{
  --bg:#eceeed; --surface:#fff; --sunk:#f4f6f5; --ink:#1b2321; --muted:#5b6864; --line:#d0d7d4;
  --accent:#1f5c4a; --accent-ink:#fff; --mark:#e3b22c; --mark-ink:#2a2208;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --bar:76px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614; --surface:#19201e; --sunk:#151b19; --ink:#e4eae7; --muted:#93a29d; --line:#2b3532;
  --accent:#5db797; --accent-ink:#0c1a15; --mark:#e6c04a; --mark-ink:#241c04; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.wrap{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(var(--bar) + env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-transform:uppercase;margin:0;line-height:1.05;letter-spacing:.01em}
h1{font-size:1.6rem}
h2{font-size:1.2rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sub{font-size:.85rem;color:var(--muted)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number]{width:100%;min-width:0;font-size:16px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:7px 12px;font-size:.85rem;font-weight:600;color:var(--muted);min-height:36px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:700;font-size:1.1rem;text-transform:uppercase;letter-spacing:.03em;min-height:44px}
.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.stepper{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.stepper .nm{font-weight:500}
.stepper .ctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.stepper .ctl button{width:44px;height:44px;border:0;background:none;font-size:1.3rem;font-weight:500}
.stepper .ctl button:active{background:var(--line)}
.stepper .ctl input{width:64px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;padding:10px 4px;background:var(--surface)}
.stepper .unit{grid-column:1;font-size:.78rem;color:var(--muted);margin-top:-6px}

/* swipe tiers */
.tiers{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:4px max(16px,env(safe-area-inset-left,0px)) 6px;scroll-padding:0 max(16px,env(safe-area-inset-left,0px))}
.tiers::-webkit-scrollbar{display:none}
@media (min-width:700px){.tiers{grid-auto-flow:row;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-columns:auto;margin:0;padding:4px 0}}
.tier{scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.tier[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.tier .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tier h3{font-size:1.6rem}
.badge{background:var(--mark);color:var(--mark-ink);font-size:.66rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 7px;border-radius:4px}
.tier .price{font-family:var(--display);font-weight:700;font-size:2.3rem;line-height:1}
.tier ul{list-style:none;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:.86rem;line-height:1.3}
.tier li b{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
@media (min-width:700px){.dots{display:none}}

.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .s{grid-column:1;font-size:.84rem;color:var(--muted)}
.line .p{grid-row:1/3;grid-column:2;align-self:center;text-align:right}
.totals{display:flex;flex-direction:column;gap:4px;border-top:2px solid var(--ink);padding-top:10px;font-size:.9rem}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .grand{font-family:var(--display);font-size:1.5rem;font-weight:700;margin-top:4px}

details.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.acc>summary{list-style:none;padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;min-height:52px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:1.2rem}
details.acc[open]>summary::after{content:"–"}
details.acc .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:.85rem;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pb-item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.pb-item h3{font-size:1.05rem}
.pb-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 8px;align-items:center}
.pb-row .t{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pb-row .nums{grid-column:2;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pb-row .nums label{display:flex;flex-direction:column;font-size:.7rem;color:var(--muted);gap:2px}
.pb-row input{padding:8px 10px}
.btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 14px;font-weight:500;min-height:44px}
.note{font-size:.8rem;color:var(--muted);margin:0}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .t{flex:1;min-width:0;display:flex;flex-direction:column}
.bar .t b{font-family:var(--display);font-size:1.7rem;line-height:1}
.bar .go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:0 18px;height:52px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:6;max-width:90vw;text-align:center}
#fallback{width:100%;min-height:180px;font:12px/1.4 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)}
body.customer .internal{display:none!important}
</style>
<body>
<div class="wrap">
  <header class="top">
    <div style="min-width:0"><div class="label">Good · Better · Best</div><h1 id="brand">Your Company</h1></div>
    <div class="seg" role="group" aria-label="View"><button type="button" id="vI" aria-pressed="true">Internal</button><button type="button" id="vC" aria-pressed="false">Customer</button></div>
  </header>

  <div class="chips" id="jobs" role="group" aria-label="Job type"></div>

  <section class="card">
    <h2>Measurements</h2>
    <div id="qtys" style="display:flex;flex-direction:column;gap:14px"></div>
  </section>

  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="label">Swipe to compare · tap to choose</div>
    <div class="tiers" id="tiers"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>

  <section class="card">
    <div><div class="label" id="qLbl">Selected option</div><h2 id="qTitle"></h2><div class="sub" id="qFor"></div></div>
    <div class="lines" id="lines"></div>
    <div class="totals" id="totals"></div>
    <p class="note">Valid 30 days. Hidden conditions found during demolition may change the price. Permits not included unless listed.</p>
    <textarea id="fallback" readonly hidden aria-label="Quote text"></textarea>
  </section>

  <details class="acc">
    <summary><h2>Customer</h2></summary>
    <div class="body">
      <div class="field"><label for="client">Name</label><input type="text" id="client" placeholder="e.g. Pat Rivera" autocomplete="off"></div>
      <div class="field"><label for="address">Job address</label><input type="text" id="address" placeholder="Street, city" autocomplete="off"></div>
    </div>
  </details>

  <details class="acc internal">
    <summary><h2>Business settings</h2></summary>
    <div class="body">
      <div class="field"><label for="company">Company name</label><input type="text" id="company"></div>
      <div class="grid2">
        <div class="field"><label for="rate">Labor $/hr</label><input type="number" inputmode="decimal" id="rate"></div>
        <div class="field"><label for="crew">Crew size</label><input type="number" inputmode="numeric" id="crew"></div>
        <div class="field"><label for="markup">Markup %</label><input type="number" inputmode="decimal" id="markup"></div>
        <div class="field"><label for="tax">Tax on materials %</label><input type="number" inputmode="decimal" id="tax"></div>
      </div>
    </div>
  </details>

  <details class="acc internal">
    <summary><div><h2>Price book</h2><div class="sub" id="pbSub"></div></div></summary>
    <div class="body"><div id="pb" style="display:flex;flex-direction:column;gap:12px"></div><button type="button" class="btn" id="reset">Reset this job to sample prices</button></div>
  </details>
</div>

<div class="bar"><div class="in">
  <div class="t"><span class="label" id="barLbl"></span><b class="num" id="barTotal"></b></div>
  <button type="button" class="go" id="copy">Copy quote</button>
</div></div>
<div class="toast" id="toast" hidden aria-live="polite"></div>

<script src="../data.js"></script>
<script>
(function(){
const G=window.GBB, TIERS=G.TIERS, usd=G.usd, esc=G.esc;
const KEY='gbb-m-classic-v1', clone=o=>JSON.parse(JSON.stringify(o));
const SAMPLE=clone(G.BOOK);
let book=G.BOOK, S={company:'Your Company',rate:65,crew:2,markup:25,tax:7}, qty={}, job='kitchen', sel=1, view='internal', client='', address='';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){if(s.book)for(const k in s.book)if(book[k])book[k]=s.book[k];if(s.S)Object.assign(S,s.S);if(s.qty)qty=s.qty;}}catch(e){}
for(const j in book){qty[j]=Object.assign(G.defaults(j),qty[j]||{});}
function sync(){G.SETTINGS.rate=+S.rate||0;G.SETTINGS.markup=+S.markup||0;G.SETTINGS.tax=+S.tax||0;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({book,S,qty}));}catch(e){}}
const $=id=>document.getElementById(id);
const fq=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const stepOf=i=>Math.max(1,Math.round((i.max-i.min)/50/5)*5||1);

function calc(ti){
  const items=book[job].items;let mat=0,lab=0,hrs=0,price=0;
  const lines=items.map((it,ii)=>{const r=G.itemPrice(job,ii,ti,qty[job]);mat+=r.mat;lab+=r.lab;hrs+=r.hrs;price+=r.price;return {it,spec:it.t[ti][0],...r,unit:G.unitOf(job,it)};});
  const mk=mat+lab, markup=mk*S.markup/100, tax=mat*S.tax/100;
  return {lines,mat,lab,hrs,markup,tax,total:price};
}
function renderJobs(){$('jobs').innerHTML=Object.keys(book).map(k=>`<button type="button" data-job="${k}" aria-pressed="${k===job}">${esc(book[k].name)}</button>`).join('');}
function renderQtys(){
  $('qtys').innerHTML=book[job].inputs.map(i=>`<div class="stepper"><label class="nm" for="q-${job}-${i.k}">${esc(i.label)}</label>
    <div class="ctl"><button type="button" data-step="-${stepOf(i)}" data-k="${i.k}" aria-label="Less ${esc(i.label)}">−</button><input type="number" inputmode="decimal" id="q-${job}-${i.k}" data-k="${i.k}" value="${qty[job][i.k]}"><button type="button" data-step="${stepOf(i)}" data-k="${i.k}" aria-label="More ${esc(i.label)}">+</button></div>
    <span class="unit">${esc(i.unit)}</span></div>`).join('');
}
function renderTiers(){
  sync();const res=[0,1,2].map(calc), crew=Math.max(1,+S.crew||1);
  $('tiers').innerHTML=res.map((r,i)=>{const d=Math.max(1,Math.ceil(r.hrs/(8*crew)));return `<button type="button" class="tier" data-tier="${i}" aria-pressed="${i===sel}">
    <div class="hd"><h3>${TIERS[i]}</h3>${i===1?'<span class="badge">Most popular</span>':''}</div>
    <div><div class="price num">${usd(r.total)}</div><div class="sub">About ${d} working day${d>1?'s':''}${i>0?` · +${usd(r.total-res[i-1].total)}`:''}</div></div>
    <ul>${r.lines.map(l=>`<li><b>${esc(l.it.name)}</b>${esc(l.spec)}</li>`).join('')}</ul></button>`;}).join('');
  $('dots').innerHTML=[0,1,2].map(i=>`<i class="${i===sel?'on':''}"></i>`).join('');
  renderQuote(res[sel]);
}
function renderQuote(r){
  const internal=view==='internal';
  $('qTitle').textContent=`${book[job].name} · ${TIERS[sel]}`;
  $('qLbl').textContent=internal?'Selected option · internal':'Your quote';
  const who=[client,address].filter(Boolean).join(' · ');$('qFor').textContent=who?'For '+who:'';
  $('lines').innerHTML=r.lines.map(l=>`<div class="line"><span>${esc(l.it.name)}</span><span class="s">${esc(l.spec)}${l.unit?` · ${fq(l.n)} ${esc(l.unit)}`:''}${internal?` · ${fq(l.hrs)} hrs`:''}</span><span class="p num">${usd(internal?l.mat+l.lab:l.price)}</span></div>`).join('');
  $('totals').innerHTML=internal?`<div><span>Materials</span><span class="num">${usd(r.mat)}</span></div><div><span>Labor · ${fq(r.hrs)} hrs</span><span class="num">${usd(r.lab)}</span></div><div><span>Markup ${S.markup}%</span><span class="num">${usd(r.markup)}</span></div><div><span>Tax on materials ${S.tax}%</span><span class="num">${usd(r.tax)}</span></div><div class="grand"><span>Total</span><span>${usd(r.total)}</span></div>`
    :`<div class="grand"><span>Total</span><span>${usd(r.total)}</span></div>`;
  $('barLbl').textContent=`${book[job].name} · ${TIERS[sel]}`;$('barTotal').textContent=usd(r.total);
}
function renderPB(){
  $('pbSub').textContent=`${book[job].name}: material $ and labor hrs per unit`;
  $('pb').innerHTML=book[job].items.map((it,ii)=>`<div class="pb-item"><h3>${esc(it.name)} <span class="sub" style="text-transform:none;font-family:var(--body);font-weight:400">per ${esc(G.unitOf(job,it)||'job')}</span></h3>`+
    it.t.map((t,ti)=>`<div class="pb-row"><span class="t">${TIERS[ti]}</span><input type="text" id="pb-${job}-${ii}-${ti}-0" data-b="${ii},${ti},0" value="${esc(t[0])}" aria-label="${esc(it.name)} ${TIERS[ti]} spec">
      <div class="nums"><label>Material $<input type="number" inputmode="decimal" id="pb-${job}-${ii}-${ti}-1" data-b="${ii},${ti},1" value="${t[1]}"></label><label>Labor hrs<input type="number" inputmode="decimal" id="pb-${job}-${ii}-${ti}-2" data-b="${ii},${ti},2" value="${t[2]}"></label></div></div>`).join('')+`</div>`).join('');
}
function all(){renderJobs();renderQtys();renderPB();renderTiers();}

['company','rate','crew','markup','tax'].forEach(k=>{const el=$(k);el.value=S[k];el.addEventListener('input',()=>{S[k]=el.type==='number'?(+el.value||0):el.value;if(k==='company')$('brand').textContent=el.value||'Your Company';save();renderTiers();});});
$('brand').textContent=S.company||'Your Company';
$('client').addEventListener('input',e=>{client=e.target.value;renderTiers();});
$('address').addEventListener('input',e=>{address=e.target.value;renderTiers();});
$('jobs').addEventListener('click',e=>{const b=e.target.closest('[data-job]');if(b){job=b.dataset.job;all();}});
$('qtys').addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;const k=b.dataset.k;qty[job][k]=Math.max(0,(+qty[job][k]||0)+(+b.dataset.step));$(`q-${job}-${k}`).value=qty[job][k];save();renderTiers();});
$('qtys').addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;qty[job][k]=+e.target.value||0;save();renderTiers();});
$('tiers').addEventListener('click',e=>{const b=e.target.closest('[data-tier]');if(!b)return;sel=+b.dataset.tier;renderTiers();});
$('tiers').addEventListener('scroll',()=>{const t=$('tiers');if(getComputedStyle(t).gridAutoFlow!=='column')return;const w=t.firstElementChild.offsetWidth+10;const i=Math.round(t.scrollLeft/w);$('dots').querySelectorAll('i').forEach((d,n)=>d.className=n===i?'on':'');},{passive:true});
$('pb').addEventListener('input',e=>{const d=e.target.dataset.b;if(!d)return;const [ii,ti,f]=d.split(',').map(Number);book[job].items[ii].t[ti][f]=f?(+e.target.value||0):e.target.value;save();renderTiers();});
$('reset').addEventListener('click',()=>{book[job]=clone(SAMPLE[job]);save();renderPB();renderTiers();toast(`${book[job].name} reset to sample prices`);});
function setView(v){view=v;document.body.classList.toggle('customer',v==='customer');$('vI').setAttribute('aria-pressed',v==='internal');$('vC').setAttribute('aria-pressed',v==='customer');renderTiers();}
$('vI').onclick=()=>setView('internal');$('vC').onclick=()=>setView('customer');
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}
function text(){const r=calc(sel),L=[`${S.company||'Your Company'} — Remodel Estimate`,new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})];
  if(client)L.push('Prepared for: '+client);if(address)L.push('Job address: '+address);
  L.push('',`${book[job].name} — ${TIERS[sel]} option`,'');r.lines.forEach(l=>L.push(`• ${l.it.name}: ${l.spec}${l.unit?` (${fq(l.n)} ${l.unit})`:''} — ${usd(l.price)}`));
  L.push('',`TOTAL: ${usd(r.total)}`,'','Other options: '+[0,1,2].filter(i=>i!==sel).map(i=>`${TIERS[i]} ${usd(calc(i).total)}`).join(' · '),'','Valid 30 days. Hidden conditions may change the final price. Permits not included unless listed.');return L.join('\n');}
$('copy').addEventListener('click',()=>{const t=text(),fb=$('fallback');
  const ok=()=>{fb.hidden=true;toast('Quote copied. Paste it into a text or email.');};
  const fail=()=>{fb.value=t;fb.hidden=false;fb.scrollIntoView({block:'center'});fb.select();toast('Copy was blocked. The quote is selected; copy it from the box.');};
  try{navigator.clipboard.writeText(t).then(ok,fail);}catch(e){fail();}});
all();
requestAnimationFrame(()=>{const t=$('tiers'),c=t.querySelector('[aria-pressed=true]');if(c&&getComputedStyle(t).gridAutoFlow==='column')t.scrollLeft=c.offsetLeft-t.firstElementChild.offsetLeft;});
})();
</script>
</body>
</html>
