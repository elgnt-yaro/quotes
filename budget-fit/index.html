<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Fit Remodel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: phone-first — budget tape and readout pinned at the top, the package it buys scrolls beneath */
:root{
  --bg:#f3f2ee; --card:#fff; --ink:#151513; --muted:#66645d; --line:#dcdad3;
  --tape:#f2c230; --tape-ink:#151513; --cut:#b2241d; --t0:#c8c5bb; --t1:#3d6f8f; --t2:#151513; --ok:#2f7a4a; --short:#b2441d;
  --wide:"Archivo","Helvetica Neue",Arial,sans-serif; --mono:"Martian Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141412; --card:#1d1d1a; --ink:#ecebe6; --muted:#a3a198; --line:#33322e;
  --tape:#e9b923; --t0:#5a5850; --t1:#6aa3c6; --t2:#ecebe6; --ok:#6cc48c; --short:#f08a5d; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--wide)}
.lbl{font-stretch:62%;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.top{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:2px solid var(--ink);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.jobs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jobs::-webkit-scrollbar{display:none}
.jobs button{flex:none;border:2px solid var(--ink);background:none;height:38px;padding:0 12px;font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.04em;font-size:.85rem}
.jobs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.readout{display:flex;align-items:center;gap:8px}
.readout .amt{flex:1;font-weight:900;font-stretch:110%;font-size:clamp(2rem,10vw,2.8rem);line-height:1;text-align:center}
.nudge{width:48px;height:48px;flex:none;border:2px solid var(--ink);background:var(--card);font-size:1.4rem;font-weight:700;border-radius:50%}
.nudge:active{background:var(--tape)}
.tape{position:relative;height:60px;background:var(--tape);color:var(--tape-ink);border-radius:4px;overflow:hidden;touch-action:pan-y;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.tape .ticks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 10%),repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 2%);background-size:100% 26px,100% 14px;background-repeat:no-repeat}
.tape .marks{position:absolute;left:0;right:0;top:28px;font:600 .62rem var(--mono)}
.tape .marks span{position:absolute;transform:translateX(3px)}
.tape .pull{position:absolute;top:0;bottom:0;left:0;background:rgba(21,21,19,.1);border-right:3px solid var(--cut);pointer-events:none}
.tape input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:ew-resize}
.tape:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:3px}
.span{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}

main{max-width:680px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.verdict{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px}
.verdict .v{font-weight:800;font-stretch:90%;font-size:1.3rem;line-height:1.15}
.verdict .v.ok{color:var(--ok)} .verdict .v.short{color:var(--short)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column}
.stats b{font:600 .9rem var(--mono)}
.pkg{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item .tag{grid-row:1/3;font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;padding:4px 0;width:54px;text-align:center;border-radius:3px}
.tag.t0{background:var(--t0);color:var(--ink)} .tag.t1{background:var(--t1);color:var(--bg)} .tag.t2{background:var(--t2);color:var(--bg)}
.item .nm{font-weight:700;font-stretch:85%}
.item .spec{grid-column:2;font-size:.84rem;color:var(--muted);line-height:1.3}
.item .pr{grid-row:1/3;grid-column:3;font:.8rem var(--mono)}
.next{border:2px dashed var(--line);border-radius:8px;padding:12px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.next button{border:2px solid var(--ink);background:var(--ink);color:var(--bg);height:44px;padding:0 14px;font-weight:700}
.foot{font-size:.76rem;color:var(--muted);margin:0}
</style>
<body>
<header class="top"><div class="in">
  <div class="jobs" id="jobs" role="group" aria-label="Room"></div>
  <div class="readout">
    <button type="button" class="nudge" id="minus" aria-label="Lower budget $500">−</button>
    <div class="amt num" id="amt" aria-live="polite"></div>
    <button type="button" class="nudge" id="plus" aria-label="Raise budget $500">+</button>
  </div>
  <div class="tape"><div class="ticks"></div><div class="marks" id="marks"></div><div class="pull" id="pull"></div><input type="range" id="budget" aria-label="Budget" step="250"></div>
  <div class="span"><span>Drag the tape or tap ±</span><span id="span"></span></div>
</div></header>
<main>
  <section class="verdict" aria-live="polite">
    <div class="v" id="verdict"></div>
    <div class="stats"><div><span class="lbl">Package</span><b id="pkgPrice"></b></div><div><span class="lbl">Left over</span><b id="left"></b></div><div><span class="lbl">Upgrades</span><b id="ups"></b></div></div>
  </section>
  <section class="pkg" id="pkg"></section>
  <div class="next" id="next"></div>
  <p class="foot">Sample prices, including labor, markup and tax. Starts with everything at Good, then adds the cheapest upgrades first until the budget runs out.</p>
</main>
<script src="../data.js"></script>
<script>
(function(){
const {TIERS,BOOK,defaults,itemPrice,total,usd,esc}=window.GBB;
const $=id=>document.getElementById(id);
let job='kitchen',qty=defaults(job),lo=0,hi=0,budget=0;
function fit(B){const items=BOOK[job].items,picks=items.map(()=>0),pr=(ii,t)=>itemPrice(job,ii,t,qty).price;
  let spent=items.reduce((s,_,ii)=>s+pr(ii,0),0);if(spent>B)return {picks,spent,short:spent-B,next:null};
  for(;;){items.forEach((_,ii)=>{while(picks[ii]<2&&Math.abs(pr(ii,picks[ii]+1)-pr(ii,picks[ii]))<=.5)picks[ii]++;});
    let best=null;items.forEach((_,ii)=>{if(picks[ii]<2){const d=pr(ii,picks[ii]+1)-pr(ii,picks[ii]);if(!best||d<best.d)best={ii,d};}});
    if(!best)return {picks,spent,short:0,next:null};if(spent+best.d>B)return {picks,spent,short:0,next:best};picks[best.ii]++;spent+=best.d;}}
function niceStep(r){const raw=r/4,p=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,5,10].map(x=>x*p).find(x=>x>=raw);}
function setup(){const g=total(job,0,qty).price,b=total(job,2,qty).price;lo=Math.floor(g*.75/1000)*1000;hi=Math.ceil(b*1.05/1000)*1000;
  if(!budget||budget<lo||budget>hi)budget=Math.round(total(job,1,qty).price/500)*500;
  const r=$('budget');r.min=lo;r.max=hi;r.value=budget;
  const st=niceStep(hi-lo);let m='';for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st){const p=(v-lo)/(hi-lo)*100;if(p>88)break;m+=`<span style="left:${p}%">${Math.round(v/1000)}k</span>`;}
  $('marks').innerHTML=m;$('span').textContent=`Good ${usd(g)} · Best ${usd(b)}`;}
function render(){const r=fit(budget),items=BOOK[job].items,ups=r.picks.reduce((s,p)=>s+p,0),max=items.length*2;
  $('amt').textContent=usd(budget);$('budget').value=budget;$('pull').style.width=((budget-lo)/(hi-lo)*100)+'%';
  const v=$('verdict');
  if(r.short){v.className='v short';v.textContent=`${usd(r.short)} short of the Good package.`;}
  else if(ups===max){v.className='v ok';v.textContent='Everything at Best, with room to spare.';}
  else{const top=r.picks.filter(p=>p===2).length;v.className='v ok';v.textContent=top?`${top} item${top>1?'s':''} at Best, the rest Good or Better.`:ups?`Good package plus ${ups} upgrade${ups>1?'s':''}.`:'The Good package fits.';}
  $('pkgPrice').textContent=usd(r.spent);$('left').textContent=r.short?'—':usd(budget-r.spent);$('ups').textContent=`${ups}/${max}`;
  $('pkg').innerHTML=items.map((it,ii)=>{const t=r.picks[ii];return `<div class="item"><span class="tag t${t}">${TIERS[t]}</span><span class="nm">${esc(it.name)}</span><span class="spec">${esc(it.t[t][0])}</span><span class="pr">${usd(itemPrice(job,ii,t,qty).price)}</span></div>`;}).join('');
  const n=$('next');
  if(r.next){const it=items[r.next.ii],t=r.picks[r.next.ii]+1,need=Math.ceil((r.spent+r.next.d)/250)*250;n.hidden=false;
    n.innerHTML=`<span>Next upgrade: <b>${usd(r.next.d)} more</b> moves ${esc(it.name.toLowerCase())} to ${TIERS[t]} (${esc(it.t[t][0])}).</span><button type="button" id="bump" data-to="${Math.min(hi,need)}">Set budget to ${usd(Math.min(hi,need))}</button>`;}
  else n.hidden=true;}
$('budget').addEventListener('input',e=>{budget=+e.target.value;render();});
$('minus').onclick=()=>{budget=Math.max(lo,budget-500);render();};
$('plus').onclick=()=>{budget=Math.min(hi,budget+500);render();};
$('next').addEventListener('click',e=>{const b=e.target.closest('#bump');if(b){budget=+b.dataset.to;render();}});
$('jobs').addEventListener('click',e=>{const b=e.target.closest('[data-job]');if(!b)return;job=b.dataset.job;qty=defaults(job);budget=0;renderJobs();setup();render();});
function renderJobs(){$('jobs').innerHTML=Object.keys(BOOK).map(k=>`<button type="button" data-job="${k}" aria-pressed="${k===job}">${BOOK[k].name}</button>`).join('');}
renderJobs();setup();render();
})();
</script>
</body>
</html>
