<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Budget Fit Remodel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Martian+Mono:wght@400;600&display=swap">
<style>
/* Layout: a tape measure runs full width as the budget control; the package it buys stacks beneath */
:root{
  --bg:#f3f2ee; --card:#ffffff; --ink:#151513; --muted:#66645d; --line:#dcdad3;
  --tape:#f2c230; --tape-ink:#151513; --tier0:#c8c5bb; --tier1:#3d6f8f; --tier2:#151513; --ok:#2f7a4a; --short:#b2441d;
  --wide:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --card:#1d1d1a; --ink:#ecebe6; --muted:#a3a198; --line:#33322e;
  --tape:#e9b923; --tape-ink:#151513; --tier0:#5a5850; --tier1:#6aa3c6; --tier2:#ecebe6; --ok:#6cc48c; --short:#f08a5d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --card:#1d1d1a; --ink:#ecebe6; --muted:#a3a198; --line:#33322e;
  --tape:#e9b923; --tape-ink:#151513; --tier0:#5a5850; --tier1:#6aa3c6; --tier2:#ecebe6; --ok:#6cc48c; --short:#f08a5d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--wide);font-stretch:100%;font-size:15px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1{font-weight:900;font-stretch:125%;font-size:clamp(2rem,6vw,3.6rem);line-height:.95;margin:0;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance}
.lbl{font-stretch:62%;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.jobs{display:flex;gap:6px;flex-wrap:wrap}
.jobs button{border:2px solid var(--ink);background:none;padding:6px 14px;font-weight:700;font-stretch:80%;text-transform:uppercase;letter-spacing:.04em}
.jobs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.budget{display:flex;flex-direction:column;gap:10px}
.readout{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.readout .amt{font-weight:900;font-stretch:110%;font-size:clamp(2.4rem,8vw,4.2rem);line-height:1}
.tape{position:relative;height:74px;background:var(--tape);color:var(--tape-ink);border-radius:4px 0 0 4px;overflow:hidden;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.35)}
.tape .ticks{position:absolute;inset:0;
  background-image:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 10%),repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 2%),repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 1%);
  background-size:100% 30px,100% 18px,100% 10px;background-repeat:no-repeat}
.tape .marks{position:absolute;left:0;right:0;top:32px;font-family:var(--mono);font-size:.68rem;font-weight:600}
.tape .marks span{position:absolute;transform:translateX(3px)}
.tape .pull{position:absolute;top:0;bottom:0;background:rgba(21,21,19,.1);border-right:3px solid #b2241d;pointer-events:none}
.tape input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.tape:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:3px}
.zone{position:absolute;bottom:0;height:8px;opacity:.85}
.legendrow{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.82rem;color:var(--muted)}

.verdict{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:flex-end}
.verdict .v{font-weight:800;font-stretch:90%;font-size:1.5rem;line-height:1.1;max-width:30ch;text-wrap:balance}
.verdict .v.ok{color:var(--ok)} .verdict .v.short{color:var(--short)}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:1.05rem;font-weight:600}

.pkg{display:flex;flex-direction:column;border-top:3px solid var(--ink)}
.item{display:grid;grid-template-columns:minmax(0,180px) 64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:620px){.item{grid-template-columns:minmax(0,1fr) auto;}.item .spec{grid-column:1/-1}.item .tag{order:-1;grid-column:1/-1;justify-self:start}}
.item .nm{font-weight:700;font-stretch:85%}
.tag{font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding:3px 8px;border-radius:3px;text-align:center}
.tag.t0{background:var(--tier0);color:var(--ink)}
.tag.t1{background:var(--tier1);color:var(--bg)}
.tag.t2{background:var(--tier2);color:var(--bg)}
.item .spec{color:var(--muted);font-size:.9rem}
.item .pr{font-family:var(--mono);font-size:.85rem;text-align:right}
.next{border:2px dashed var(--line);border-radius:6px;padding:14px 16px;font-size:.92rem}
.next b{font-weight:800}
.foot{font-size:.78rem;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){.tape .pull{transition:width .08s linear}}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:14px">
    <span class="lbl">Budget Fit</span>
    <h1>Set your budget. We'll build the best job it buys.</h1>
    <div class="jobs" id="jobs" role="group" aria-label="Room"></div>
  </header>

  <section class="budget">
    <div class="readout"><span class="lbl">Your budget</span><span class="amt num" id="amt">$0</span></div>
    <div class="tape">
      <div class="ticks"></div>
      <div class="marks" id="marks"></div>
      <div class="zone" id="zGood"></div>
      <div class="pull" id="pull"></div>
      <input type="range" id="budget" aria-label="Budget" step="250">
    </div>
    <div class="legendrow"><span>Drag the tape</span><span id="span"></span></div>
  </section>

  <section class="verdict" aria-live="polite">
    <div class="v" id="verdict"></div>
    <div class="stat"><span class="lbl">Package price</span><b id="pkgPrice"></b></div>
    <div class="stat"><span class="lbl">Left over</span><b id="left"></b></div>
    <div class="stat"><span class="lbl">Upgrades</span><b id="ups"></b></div>
  </section>

  <section class="pkg" id="pkg"></section>
  <div class="next" id="next"></div>
  <p class="foot">Sample prices for default room sizes, including labor, markup and tax. The builder upgrades the cheapest items first so you get as many upgrades as the budget allows.</p>
</div>

<script src="../data.js"></script>
<script>
(function(){
const {TIERS,BOOK,defaults,itemPrice,total,usd,esc}=window.GBB;
const $=id=>document.getElementById(id);
let job='kitchen', qty=defaults(job), lo=0, hi=0, budget=0;
function bounds(){
  const g=total(job,0,qty).price, b=total(job,2,qty).price;
  lo=Math.floor(g*0.75/1000)*1000; hi=Math.ceil(b*1.05/1000)*1000;
}
function fit(B){
  const items=BOOK[job].items, picks=items.map(()=>0);
  const price=(ii,t)=>itemPrice(job,ii,t,qty).price;
  let spent=items.reduce((s,_,ii)=>s+price(ii,0),0);
  if(spent>B)return {picks,spent,short:spent-B,next:null};
  while(true){
    let best=null;
    items.forEach((_,ii)=>{if(picks[ii]<2){const d=price(ii,picks[ii]+1)-price(ii,picks[ii]);if(d>0.5&&(!best||d<best.d))best={ii,d};}
      else{} });
    // skip upgrades that cost nothing extra (same spec) by applying them free
    items.forEach((_,ii)=>{if(picks[ii]<2&&Math.abs(price(ii,picks[ii]+1)-price(ii,picks[ii]))<=0.5)picks[ii]++;});
    if(!best)return {picks,spent,short:0,next:null};
    if(spent+best.d>B)return {picks,spent,short:0,next:best};
    picks[best.ii]++;spent+=best.d;
  }
}
function renderJobs(){$('jobs').innerHTML=Object.keys(BOOK).map(k=>`<button type="button" data-job="${k}" aria-pressed="${k===job}">${BOOK[k].name}</button>`).join('');}
function setupTape(){
  bounds();const r=$('budget');r.min=lo;r.max=hi;
  if(!budget||budget<lo||budget>hi)budget=Math.round(total(job,1,qty).price/500)*500;
  r.value=budget;
  const stepK=niceStep(hi-lo);let m='';
  for(let v=Math.ceil(lo/stepK)*stepK;v<=hi;v+=stepK){const p=(v-lo)/(hi-lo)*100;if(p>92)break;m+=`<span style="left:${p}%">${v>=1000?Math.round(v/1000)+'k':v}</span>`;}
  $('marks').innerHTML=m;
  const g=total(job,0,qty).price,b=total(job,2,qty).price;
  $('span').textContent=`All Good ${usd(g)} · All Best ${usd(b)}`;
}
function niceStep(range){const raw=range/6;const p=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,5,10].map(x=>x*p).find(x=>x>=raw);}
function render(){
  const r=fit(budget), items=BOOK[job].items;
  $('amt').textContent=usd(budget);
  $('pull').style.width=((budget-lo)/(hi-lo)*100)+'%';
  const ups=r.picks.reduce((s,p)=>s+p,0), maxUps=items.length*2;
  const v=$('verdict');
  if(r.short){v.className='v short';v.textContent=`Short by ${usd(r.short)} for even the Good package. Try a smaller scope or raise the budget.`;}
  else if(ups===maxUps){v.className='v ok';v.textContent=`Everything at Best, with room to spare.`;}
  else{const top=r.picks.filter(p=>p===2).length;v.className='v ok';v.textContent=top?`${top} item${top>1?'s':''} at Best, the rest Good or Better.`:(ups?`A solid Good job with ${ups} upgrade${ups>1?'s':''}.`:`The Good package fits.`);}
  $('pkgPrice').textContent=usd(r.spent);
  $('left').textContent=r.short?'—':usd(budget-r.spent);
  $('ups').textContent=`${ups} of ${maxUps}`;
  $('pkg').innerHTML=items.map((it,ii)=>{const t=r.picks[ii];return `<div class="item"><span class="nm">${esc(it.name)}</span><span class="tag t${t}">${TIERS[t]}</span><span class="spec">${esc(it.t[t][0])}</span><span class="pr">${usd(itemPrice(job,ii,t,qty).price)}</span></div>`;}).join('');
  const n=$('next');
  if(r.next){const it=items[r.next.ii],t=r.picks[r.next.ii]+1;n.hidden=false;n.innerHTML=`Next upgrade: <b>${usd(r.next.d)} more</b> moves ${esc(it.name.toLowerCase())} to ${TIERS[t]} (${esc(it.t[t][0])}).`;}
  else n.hidden=true;
}
$('budget').addEventListener('input',e=>{budget=+e.target.value;render();});
$('jobs').addEventListener('click',e=>{const b=e.target.closest('[data-job]');if(!b)return;job=b.dataset.job;qty=defaults(job);budget=0;renderJobs();setupTape();render();});
renderJobs();setupTape();render();
})();
</script>
