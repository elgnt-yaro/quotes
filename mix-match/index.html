<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mix & Match Remodel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: phone-first finish board — one card per item with a three-swatch segmented picker; running total pinned to the bottom */
:root{
  --bg:#f7f7f4; --card:#fff; --ink:#22211e; --muted:#6c6a63; --line:#e1dfd8;
  --good:#d9c4a0; --good-ink:#3b2f19; --better:#7c93a8; --better-ink:#fff; --best:#4a2f22; --best-ink:#f4e8dc;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171614; --card:#201f1c; --ink:#eeebe4; --muted:#a19d93; --line:#34322d;
  --good:#c9b38c; --good-ink:#2b2210; --better:#8aa2b8; --better-ink:#0f1820; --best:#8a5a42; --best-ink:#fbefe4; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) calc(140px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:800;font-size:2.1rem;line-height:1;margin:0;letter-spacing:-.02em}
h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
.lede{color:var(--muted);margin:0;font-size:.95rem}
.lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scroller{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.scroller::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 16px;height:44px;font-weight:600;font-size:.92rem}
.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.ghost{background:none;border-style:dashed;font-weight:500;color:var(--muted)}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.item .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .hd span{font-size:.78rem;color:var(--muted)}
.item .spec{font-size:.9rem;min-height:2.6em;line-height:1.3}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sw{border:2px solid transparent;border-radius:10px;padding:8px 6px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.sw[data-t="0"]{background:var(--good);color:var(--good-ink)}
.sw[data-t="1"]{background:var(--better);color:var(--better-ink)}
.sw[data-t="2"]{background:var(--best);color:var(--best-ink)}
.sw .tn{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.sw .pr{font-family:var(--mono);font-size:.78rem}
.sw[aria-pressed=false]{opacity:.42}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--card)}
.foot{font-size:.78rem;color:var(--muted);margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.bar .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;letter-spacing:-.02em}
.track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--good),var(--better),var(--best))}
.marker{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.marker{transition:left .25s}.sw{transition:opacity .15s}}
</style>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:8px">
    <h1>Mix &amp; match your remodel</h1>
    <p class="lede">Splurge where it matters, save where it doesn't. Tap a finish for each part of the job.</p>
  </header>
  <div class="scroller" id="jobs" role="group" aria-label="Room"></div>
  <div class="scroller" role="group" aria-label="Start from">
    <button type="button" class="pill ghost" data-all="0">All Good</button><button type="button" class="pill ghost" data-all="1">All Better</button><button type="button" class="pill ghost" data-all="2">All Best</button>
  </div>
  <div id="board" style="display:flex;flex-direction:column;gap:10px"></div>
  <p class="foot">Sample prices for typical room sizes, including labor, markup and tax.</p>
</div>
<div class="bar" aria-live="polite"><div class="in">
  <div class="row"><span class="lbl" id="sumLbl">Your mix</span><span class="big num" id="sumTotal"></span></div>
  <div class="track"><div class="marker" id="marker"></div></div>
  <div class="ends"><span id="lo"></span><span id="hi"></span></div>
</div></div>
<script src="../data.js"></script>
<script>
(function(){
const {TIERS,BOOK,defaults,itemPrice,total,usd,esc,unitOf}=window.GBB;
const $=id=>document.getElementById(id);
let job='kitchen',qty=defaults(job),picks=[1,1,2,0,1,2,1];
function renderJobs(){$('jobs').innerHTML=Object.keys(BOOK).map(k=>`<button type="button" class="pill" data-job="${k}" aria-pressed="${k===job}">${BOOK[k].name}</button>`).join('');}
function card(it,ii){const u=unitOf(job,it),n=it.q?qty[it.q]:null,p=picks[ii];
  return `<div class="item" id="it-${ii}"><div class="hd"><h2>${esc(it.name)}</h2><span class="num">${n!=null?n+' '+esc(u):'whole job'}</span></div>
  <div class="spec">${esc(it.t[p][0])}</div><div class="seg" role="group" aria-label="${esc(it.name)} finish">`+
  it.t.map((t,ti)=>`<button type="button" class="sw" data-i="${ii}" data-t="${ti}" aria-pressed="${p===ti}" aria-label="${TIERS[ti]}: ${esc(t[0])}"><span class="tn">${TIERS[ti]}</span><span class="pr">${usd(itemPrice(job,ii,ti,qty).price)}</span></button>`).join('')+`</div></div>`;}
function renderBoard(){$('board').innerHTML=BOOK[job].items.map(card).join('');}
function renderSum(){const t=total(job,picks,qty).price,lo=total(job,0,qty).price,hi=total(job,2,qty).price;
  $('sumTotal').textContent=usd(t);$('sumLbl').textContent=`Your ${BOOK[job].name.toLowerCase()} mix`;
  $('lo').textContent='All Good '+usd(lo);$('hi').textContent='All Best '+usd(hi);
  $('marker').style.left=Math.max(0,Math.min(100,(t-lo)/(hi-lo)*100))+'%';}
$('jobs').addEventListener('click',e=>{const b=e.target.closest('[data-job]');if(!b)return;job=b.dataset.job;qty=defaults(job);picks=BOOK[job].items.map(()=>1);renderJobs();renderBoard();renderSum();});
$('board').addEventListener('click',e=>{const s=e.target.closest('.sw');if(!s)return;const ii=+s.dataset.i;picks[ii]=+s.dataset.t;
  $('it-'+ii).outerHTML=card(BOOK[job].items[ii],ii);renderSum();const n=document.querySelector(`#it-${ii} [data-t="${picks[ii]}"]`);if(n)n.focus({preventScroll:true});});
document.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>{picks=picks.map(()=>+b.dataset.all);renderBoard();renderSum();}));
renderJobs();renderBoard();renderSum();
})();
</script>
</body>
</html>
